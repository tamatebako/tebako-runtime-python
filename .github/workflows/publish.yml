# The release coordinator — SKELETON (the TODO.python/02 bootstrap PR).
#
# Mirrors tebako-runtime-ruby's publish.yml grammar: the three
# first-class slice shapes —
#   one python on every platform  (python_filter=<version>, platform=all)
#   one platform, every python    (python_filter=full|tidy|catalog, platform=<one>)
#   one python on one platform    (python_filter=<version>, platform=<one>)
# plus the era baseline (python_filter=catalog, platform=all).
#
# The build legs and the release step FAIL CLOSED at their TODO
# boundaries (exit 64) until the real CPython build logic lands — an
# accidental dispatch never half-builds or half-publishes.
#
# Deliberate deviations from the ruby coordinator, at skeleton scope:
#   - ONE matrix build job instead of the _build-platform.yml reusable
#     fan-out. The per-platform reusable split arrives WITH the real
#     build logic, when per-platform divergence (msys2 provisioning,
#     container vs host legs, the boot smoke) justifies it — port the
#     ruby shape then, not before.
#   - publish defaults to FALSE (ruby: true). This factory has no
#     release yet; the first publish is an explicit operator act.
#   - The single serialized release job below IS the ruby shape from day
#     one (the 2026-08-09 lesson: per-platform publish jobs serialized
#     through a shared concurrency group displaced queued publishes).
name: publish

on:
  workflow_dispatch:
    inputs:
      python_filter:
        description: 'Pythons: "full" (line tips), "tidy", "catalog" (every published version), or comma-separated versions'
        type: string
        default: 'full'
      platform:
        description: 'Platform slice: "all" or one of windows | linux-gnu | linux-musl | macos'
        type: string
        default: 'all'
      arch_filter:
        description: 'Optional arch slice within each platform (x86_64 | arm64)'
        type: string
        default: 'all'
      publish:
        description: 'Publish this run''s packages to the release (NOT WIRED yet — the release job fails closed at its TODO boundary)'
        type: boolean
        default: false
      audit:
        description: 'Audit only: verify the release against the expected matrix, no builds/uploads (NOT WIRED yet)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # The plan stage: contract.yml (catalog + pins) x .github/matrix.json
  # (env vocabulary) under the dispatch filters. Every downstream value
  # flows from these outputs — workflow YAML never hardcodes a version,
  # a tag, or a SHA (ecosystem SSOT invariant).
  plan:
    name: Compute the leg matrix
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.emit.outputs.legs }}
      leg_count: ${{ steps.emit.outputs.leg_count }}
      tebako_version: ${{ steps.emit.outputs.tebako_version }}
      link_unit_release: ${{ steps.emit.outputs.link_unit_release }}
      source_release: ${{ steps.emit.outputs.source_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - id: emit
        env:
          PYTHON_FILTER: ${{ inputs.python_filter }}
          PLATFORM_FILTER: ${{ inputs.platform }}
          ARCH_FILTER: ${{ inputs.arch_filter }}
        run: |
          set -euo pipefail
          legs=$(scripts/compute_matrix.rb)
          count=$(jq '.include | length' <<< "$legs")
          {
            echo "legs=$legs"
            echo "leg_count=$count"
            echo "tebako_version=$(cat VERSION)"
            echo "link_unit_release=$(scripts/versions --pin link_unit_release)"
            echo "source_release=$(scripts/versions --pin source_release)"
          } >> "$GITHUB_OUTPUT"
          # Mirror the plan to the LOG: values written only to
          # $GITHUB_OUTPUT leave no diagnosable record when the legs skip.
          echo "plan: $count legs (python=${PYTHON_FILTER} platform=${PLATFORM_FILTER} arch=${ARCH_FILTER})"
          jq -r '.include[] | "  \(.python) \(.os)/\(.arch) on \(.host)"' <<< "$legs"

  build:
    name: ${{ matrix.python }} / ${{ matrix.os }}-${{ matrix.arch }}
    needs: plan
    # An unguarded empty matrix poisons the run conclusion.
    if: needs.plan.outputs.leg_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.legs) }}
    runs-on: ${{ matrix.host }}
    # "null" for the runner-native legs (macos, windows — the documented
    # tebako-ci-containers exception); the tpkg-builder image ref with
    # contract.yml's container_version tag otherwise.
    container: ${{ fromJSON(matrix.container_json) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # TODO.python/02 follow-ups — the real leg, in the ruby factory's
      # stage order (tebako-runtime-ruby _build-platform.yml), all driven
      # by tools/build_runtime's phases:
      #   1. fetch + verify tfs-python-<python>-src.tar.gz from the
      #      tamatebako/python release named by the plan's source_release
      #      output (FAILS CLOSED while the pin is empty — the source
      #      factory has published no release yet)
      #   2. link unit: link-unit-<ver>-<link_unit_pid>.tar.gz off the
      #      tamatebako/tebako release named by the plan's
      #      link_unit_release output (port tebako-runtime-ruby
      #      ci/link-unit-download.sh; a pin miss builds from source, a
      #      checksum mismatch is a hard error)
      #   3. configure && make the relocatable CPython (per-OS
      #      provisioning: Brewfile on macos, msys2 ucrt64 on windows,
      #      the baked tpkg-builder toolchain on linux)
      #   4. link the spec-17 driver into python3 (tools/build_runtime
      #      phase 4 — the LINKED-driver decision, README.md)
      #   5. pack the env image: stdlib + selected site-packages -> .tfs
      #      via tfs mkimage (the limnifs writer)
      #   6. boot smoke: TEBAKO_RUNTIME_IMAGE handoff, PYTHONHOME/
      #      PYTHONPATH from the baked mount root, TEBAKO_MOUNT_ROOT
      #      exit 65/78 parity with ruby's
      - name: Build the runtime (TODO boundary — fails closed)
        run: |
          echo "::notice::leg ${{ matrix.python }} / ${{ matrix.os }}-${{ matrix.arch }} (link-unit pid ${{ matrix.link_unit_pid }}, host ${{ matrix.host }})"
          echo "::error::real CPython build logic lands in the TODO.python/02 follow-up PRs — the phase plan is tools/build_runtime's header"
          exit 64

      # The artifact contract the release job consumes: one artifact per
      # platform-arch workspace (tebako-runtime-ruby's runtime-packages-*
      # pattern). Unreachable until the TODO boundary above is replaced.
      - name: Stage the runtime packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-packages-${{ matrix.os }}-${{ matrix.arch }}
          path: runtime-packages/

  # The ONE release job per coordinator run. Publishing writes to the
  # single shared release, so it must serialize — running the publishes
  # sequentially inside ONE job gives the release its serialization with
  # zero group contention (the ruby factory's publish.yml carries the
  # full rationale).
  release:
    name: Publish the runtime packages
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-runtime-packages
      cancel-in-progress: false
    # publish requires green builds; audit is a read-only probe of the
    # release against the expected matrix and needs none.
    if: ${{ always() && !cancelled() && ((inputs.publish && needs.build.result == 'success') || inputs.audit) }}
    env:
      GITHUB_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the runtime packages
        if: ${{ inputs.publish }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-packages-*
          path: runtime-packages
          merge-multiple: true

      # TODO.python/02 follow-up: port tebako-runtime-ruby
      # scripts/upload_release.rb — per-asset .sha256 sidecars (the store
      # trust-anchor shape), per-package .manifest.json shards (the
      # additive image key + interpreter paths + contract_version), and
      # the derived monoliths (manifest.json / SHA256SUMS.txt) + release
      # notes from the ONE finalize pass. The issue-139 layout from day
      # one — no legacy monolith-only mode.
      - name: Update the release (TODO boundary — fails closed)
        env:
          AUDIT_ONLY: ${{ inputs.audit }}
        run: |
          if [ "$AUDIT_ONLY" = "true" ]; then
            echo "::notice::audit is NOT WIRED yet — there is no release to verify (the expected matrix: ${{ needs.plan.outputs.leg_count }} legs)"
            exit 0
          fi
          echo "::error::release assembly (the upload_release.rb port) lands in a TODO.python/02 follow-up PR"
          exit 64
