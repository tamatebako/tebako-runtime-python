# The ONE per-platform build workflow (tebako-runtime-ruby's
# _build-platform.yml role, at this factory's scope). Called by the four
# thin platform triggers (build-<platform>.yml) and by the publish.yml
# coordinator — never dispatched directly.
#
# Stage 1 (compute): the contract gate (schema + pins + the driver-source
#   parity arm) runs, then scripts/compute_matrix.rb expands THIS
#   platform's legs under the dispatch filters. Every downstream value
#   flows from these outputs — workflow YAML never hardcodes a version, a
#   tag, or a SHA (ecosystem SSOT invariant).
# Stage 2 (build): one leg per (python x arch) of this platform:
#   tools/build_runtime -> ci/check_symbol_provenance.sh ->
#   tools/boot_smoke -> the runtime-packages-<os>-<arch>-<python>
#   artifact. The build scripts fetch and sha256-verify every input
#   themselves (the pinned source tarball, the pinned link unit, the tfs
#   CLI) — there is NO source-build path for the driver stack here
#   (contract.yml's link_unit_release comment), so the ruby factory's
#   whole link-unit staging job has no counterpart. A jit python's leg
#   additionally provisions its build-time-only toolchain
#   (ci/provision_jit_toolchain.sh in the container, brew llvm@N on
#   macos) from the leg's jit_llvm plan value.
# Stage 3 (publish + sign): the leg that built a package publishes it
#   (scripts/upload_release.rb) and signs its served names
#   (scripts/sign_release.rb) in the same invocation — spec 13 §2a's
#   de-rendezvous (tebako-runtime-ruby#161's pattern): write-once
#   per-leg names, no shared release-asset mutation, so N legs publish
#   concurrently with zero rendezvous and one failed leg no longer
#   blocks the green legs' packages. The coordinator (publish.yml)
#   keeps ONE release job: the read-only audit of the whole matrix
#   against the release.
#
# Container grammar (the ruby factory's): the linux legs run on the
# ubuntu host and docker-run the tpkg-builder image per step — the musl
# image is alpine-based and node actions cannot run on musl, so the
# job-level container: form is out. macos legs are runner-native (brew
# bundle), windows legs runner-native under msys2 ucrt64.
#
# The cache holds ONLY the sha256-verified downloads (.build/downloads)
# and the staged link unit (.build/link-unit): a restored entry re-verifies
# against the release-declared digests on use, so a poisoned or stale cache
# cannot survive a pin bump (the key also carries contract.yml's hash).
# save-always: a red boot smoke must never tax the next leg a cold
# re-download (the ruby factory's msys campaign lesson). CACHE_VER stays
# the manual escape hatch.
name: _build-platform

on:
  workflow_call:
    inputs:
      platform:
        description: 'This call''s platform: windows | linux-gnu | linux-musl | macos'
        required: true
        type: string
      python_filter:
        description: 'Pythons: "full", "tidy", "catalog", or comma-separated versions'
        type: string
        default: 'full'
      arch_filter:
        description: 'Arch slice: "all" or an arch (x86_64 | arm64)'
        type: string
        default: 'all'
      audit:
        description: 'Audit only: compute the legs, build nothing (publish.yml''s audit mode)'
        type: boolean
        default: false
      publish:
        description: 'Publish each leg''s runtime package to the release and sign its served names (spec 13 §2a / spec 09 §5)'
        type: boolean
        default: false
      force_rebuild:
        description: 'Re-upload even unchanged assets (reaches upload_release.rb as FORCE_REBUILD)'
        type: boolean
        default: false
    outputs:
      run:
        description: '"true" when this platform has legs under the filters (set in audit mode too — the audit reads the expectations)'
        value: ${{ jobs.compute.outputs.run }}
      tebako_version:
        description: 'The runtime package version (the VERSION file)'
        value: ${{ jobs.compute.outputs.tebako_version }}
      env_matrix:
        description: 'The selected matrix.json rows (+ host_id) as JSON — the release job''s EXPECTED_ENV_MATRIX'
        value: ${{ jobs.compute.outputs.env_matrix }}
      python_matrix:
        description: 'The selected python versions as JSON — the release job''s EXPECTED_PYTHON_MATRIX'
        value: ${{ jobs.compute.outputs.python_matrix }}

env:
  CACHE_VER: 1

jobs:
  compute:
    name: Compute the ${{ inputs.platform }} legs
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.emit.outputs.run }}
      leg_count: ${{ steps.emit.outputs.leg_count }}
      legs: ${{ steps.emit.outputs.legs }}
      tebako_version: ${{ steps.emit.outputs.tebako_version }}
      env_matrix: ${{ steps.emit.outputs.env_matrix }}
      python_matrix: ${{ steps.emit.outputs.python_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # The contract gate first: contract.yml against its schema, the
      # catalog resolvable, AND the driver-source parity arm (the pinned
      # link-unit release's TEBAKO_CONTRACT_VERSION vs contract_version).
      - name: validate the contract
        run: bundle exec scripts/check_contract.rb

      - id: emit
        env:
          PYTHON_FILTER: ${{ inputs.python_filter }}
          PLATFORM_FILTER: ${{ inputs.platform }}
          ARCH_FILTER: ${{ inputs.arch_filter }}
          # The publish run flag + the owner's windows/arm64 serving
          # gate — compute_matrix's publish gate reads both (build CI
          # runs the arm64 leg ungated once its link-unit asset exists;
          # a publish run serves it only with the variable armed).
          PUBLISH: ${{ inputs.publish }}
          TEBAKO_SERVE_WINDOWS_ARM64: ${{ vars.TEBAKO_SERVE_WINDOWS_ARM64 }}
          # compute_matrix reads the tamatebako/python + tamatebako/tebako
          # release APIs (the windows legs' asset gates): authenticated
          # calls keep the shared runner NAT's 60/h budget out of the
          # plan (the build job's same note).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          legs=$(scripts/compute_matrix.rb)
          count=$(jq '.include | length' <<< "$legs")
          {
            echo "legs=$legs"
            echo "leg_count=$count"
            if [ "$count" -gt 0 ]; then echo "run=true"; else echo "run=false"; fi
            echo "tebako_version=$(cat VERSION)"
            echo "env_matrix=$(scripts/compute_matrix.rb --format env)"
            echo "python_matrix=$(scripts/compute_matrix.rb --format pythons)"
          } >> "$GITHUB_OUTPUT"
          # Mirror the plan to the LOG: values written only to
          # $GITHUB_OUTPUT leave no diagnosable record when the legs skip.
          echo "plan (${{ inputs.platform }}): $count legs (python=${PYTHON_FILTER} arch=${ARCH_FILTER})"
          jq -r '.include[] | "  \(.python) \(.os)/\(.arch) on \(.host)" + (if .jit_llvm != "" then " [llvm \(.jit_llvm)]" else "" end)' <<< "$legs"

  build:
    name: ${{ matrix.python }} / ${{ matrix.os }}-${{ matrix.arch }}
    needs: compute
    # An unguarded empty matrix poisons the run conclusion; an audit run
    # builds nothing (publish.yml's audit mode verifies the RELEASE).
    if: ${{ always() && !cancelled() && needs.compute.outputs.run == 'true' && !inputs.audit }}
    runs-on: ${{ matrix.host }}
    # A hung leg fails loudly at the cap, never silently (the ruby
    # factory's 150-minute record is the reference).
    timeout-minutes: 150
    # build_runtime's release-digest fetches ride the GitHub API;
    # unauthenticated calls share the runner NAT's 60/h budget and die on
    # 403 flakes (the 02 round-4 macos leg). secrets.GITHUB_TOKEN raises
    # the budget to 5000/h; the container leg forwards it via -e below.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute.outputs.legs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create folder for runtime packages
        run: mkdir -p runtime-packages

      - name: Cache the verified downloads + the staged link unit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/downloads
            .build/link-unit
          key: tebako-python-dl-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('contract.yml') }}-v${{ env.CACHE_VER }}
          save-always: true

      # --- provisioning (host-native legs only; the container legs'
      # toolchain is baked into the tpkg-builder image — except the jit
      # legs' exact-major LLVM + host python, which the container build
      # step provisions per leg via ci/provision_jit_toolchain.sh) ------
      - name: Setup Ruby (the build tooling's interpreter)
        if: matrix.os == 'macos'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: false

      # The Brewfile is the pin: --no-upgrade stops brew from upgrading
      # already-installed formulas mid-matrix (the ruby factory's rule).
      - name: Install brew packages
        if: matrix.os == 'macos'
        run: brew bundle --no-upgrade -f

      # The jit legs' build-time-only LLVM — deliberately NOT in the
      # Brewfile: a plain leg must never pay for the big keg-only llvm@N
      # installs. CPython's own discovery (Tools/jit/_llvm.py) finds the
      # keg via `brew --prefix llvm@N`; the build gate verifies the major
      # matches the source's pin. list-guarded — the Brewfile's
      # --no-upgrade rule applies here too.
      - name: Install the jit toolchain (jit legs only)
        if: matrix.os == 'macos' && matrix.jit_llvm != ''
        run: brew list "llvm@${{ matrix.jit_llvm }}" >/dev/null 2>&1 || brew install "llvm@${{ matrix.jit_llvm }}"

      - name: Setup MSys
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          # x86_64 legs build in the ucrt64 environment (the proven
          # gcc shape); the arm64 legs run the windows-11-arm hosted
          # runner's native clangarm64 environment (triple
          # aarch64-w64-mingw32 — MSYS2's own windows-on-arm recipe,
          # the environment its aarch64 python package builds in).
          msystem: ${{ matrix.arch == 'arm64' && 'clangarm64' || 'ucrt64' }}
          path-type: minimal
          update: true

      # The environment's mingw toolchain + the mingw-w64 openssl/zlib
      # dev packages (the msys-runtime openssl/zlib would mismatch the
      # mingw target), libffi (the msys _ctypes extension's only dep —
      # bound statically via Mlibs' MODULE__CTYPES_LDFLAGS rewrite),
      # plus make and the msys ruby the build tooling runs on. The
      # package namespace follows the environment: ucrt-x86_64 on the
      # x64 legs, clang-aarch64 on the arm64 legs (whose llvm toolchain
      # ships nm/objdump under both the plain and llvm- spellings).
      - name: Install pacman packages
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          case "${{ matrix.arch }}" in
            arm64) ns=clang-aarch64 ;;
            *)     ns=ucrt-x86_64 ;;
          esac
          pacman -S --needed --noconfirm git make ruby \
            mingw-w64-$ns-toolchain \
            mingw-w64-$ns-openssl mingw-w64-$ns-zlib \
            mingw-w64-$ns-libffi

      # --- build -------------------------------------------------------
      # The jit legs provision their build-time-only toolchain first
      # (exact-major LLVM + host python >= 3.11; matrix.jit_llvm is empty
      # on plain legs, which skip the call entirely).
      - name: Build the runtime (container legs)
        if: matrix.container != null
        run: |
          set -euo pipefail
          docker run --rm -e GITHUB_TOKEN -e JIT_LLVM="${{ matrix.jit_llvm }}" \
            -v "${{ github.workspace }}:/mnt/w" -w /mnt/w \
            "${{ matrix.container }}" bash -c '
              set -e
              if [ -n "${JIT_LLVM:-}" ]; then ci/provision_jit_toolchain.sh "$JIT_LLVM"; fi
              tools/build_runtime --python "${{ matrix.python }}"
              # Root in the container writes root-owned files onto the
              # bind mount; hand them back to the runner user so the host
              # steps (cache save, artifact upload) can read/write them.
              uid=$(stat -c %u /mnt/w/contract.yml); gid=$(stat -c %g /mnt/w/contract.yml)
              chown -R "$uid:$gid" /mnt/w/.build /mnt/w/runtime-packages 2>/dev/null || true'

      - name: Build the runtime (macos)
        if: matrix.os == 'macos'
        run: tools/build_runtime --python "${{ matrix.python }}"

      - name: Build the runtime (windows)
        id: build-windows
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          git config --global core.longpaths true
          rc=0
          # --arch: the leg's declared arch. The msys tooling ruby on a
          # windows-11-arm runner is the emulated x64 build — its
          # host_cpu self-report (x86_64) would mis-key the msys2
          # environment, the link-unit pid, and the package name.
          tools/build_runtime --python "${{ matrix.python }}" --arch "${{ matrix.arch }}" || rc=$?
          # 107 = the msys socket-selectability gate (PythonBuild): the
          # pinned source_release predates the mingw _PyIsSelectable_fd
          # carve-out, so no windows runtime can honestly build from it.
          # The factory's loud-skip shape (compute_matrix's no-windows-
          # asset / no-jit-on-windows precedents): the leg skips with a
          # named notice instead of red-ing, and everything downstream
          # gates on the output. A publish run is NOT covered by the
          # skip — the publish steps stay ungated and fail named on the
          # nothing-to-publish reality.
          if [ "$rc" -eq 107 ]; then
            echo "::notice title=windows leg skipped loudly::the pinned source_release predates the mingw _PyIsSelectable_fd carve-out (tamatebako/python's pycore_fileutils_msys) — bump source_release to the release carrying it; this leg builds and validates nothing"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"

      # Spec 31 §5/§8.4: sign (Developer ID Application, hardened
      # runtime, the ci/runtime.entitlements pair) + notarize the macOS
      # runtime exe IN-LEG, before the symbol-provenance check and the
      # boot smoke — every downstream gate, and the publish stage's
      # .sha256 sidecar, anchors the exact SIGNED bytes (sign-then-hash
      # is mandatory). Gated on the repo variable APPLE_SIGNING_ENABLED
      # (unsigned stays first-class without it — spec 00 invariant 7;
      # armed + a missing secret is a fast named failure). The exe is
      # left quarantine-marked: the boot smoke — the jit_llvm legs
      # exercise CPython's JIT — then runs under Gatekeeper's exact
      # download path, proving the allow-jit/disable-library-validation
      # pair on the signed exe.
      - name: Sign + notarize the runtime exe (macos, spec 31)
        if: matrix.os == 'macos'
        shell: bash
        env:
          APPLE_SIGNING_ENABLED: ${{ vars.APPLE_SIGNING_ENABLED }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          runtime="tebako-runtime-${{ needs.compute.outputs.tebako_version }}-${{ matrix.python }}-${{ matrix.host_id }}"
          bash ci/macos-sign-notarize-runtime.sh "runtime-packages/$runtime"

      # --- the gates (a red gate skips the publish below, and the
      # release job's audit then fails the run loudly) ------------------
      - name: Check symbol provenance (container legs)
        if: matrix.container != null
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/mnt/w" -w /mnt/w \
            "${{ matrix.container }}" bash -c '
              set -e
              ci/check_symbol_provenance.sh --exe \
                "runtime-packages/tebako-runtime-${{ needs.compute.outputs.tebako_version }}-${{ matrix.python }}-${{ matrix.host_id }}"'

      - name: Check symbol provenance (macos)
        if: matrix.os == 'macos'
        run: |
          ci/check_symbol_provenance.sh --exe \
            "runtime-packages/tebako-runtime-${{ needs.compute.outputs.tebako_version }}-${{ matrix.python }}-${{ matrix.host_id }}"

      # The exe name carries .exe on this leg (Platform#exe_suffix) and it
      # must be spelled out: msys stat() transparency lets foo.exe satisfy
      # `[ -s foo ]`, but the native nm/objdump open the argument verbatim
      # — an extensionless spelling is ENOENT to them and reads back as a
      # stripped exe (run 34758424181's false wall). The ruby factory
      # spells ruby.exe the same way.
      - name: Check symbol provenance (windows)
        if: matrix.os == 'windows' && steps.build-windows.outputs.skipped != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ci/check_symbol_provenance.sh --exe \
            "runtime-packages/tebako-runtime-${{ needs.compute.outputs.tebako_version }}-${{ matrix.python }}-${{ matrix.host_id }}.exe"

      # The boot smoke self-selects the scenario set per platform (the
      # POSIX set vs the windows bare + named-error trio) and resolves the
      # exe from TEBAKO_RUNTIME_ROOT. TEBAKO_TFS names the tfs CLI the
      # build fetched (the fixture-image scenarios pack with it) — inside
      # the container legs it is the musl/gnu binary matching the image.
      - name: Boot smoke (container legs)
        if: matrix.container != null
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/mnt/w" -w /mnt/w \
            "${{ matrix.container }}" bash -c '
              set -e
              export TEBAKO_RUNTIME_ROOT=runtime-packages
              TEBAKO_TFS=$(echo .build/downloads/tfs/*/tfs-*)
              export TEBAKO_TFS
              tools/boot_smoke'

      - name: Boot smoke (macos)
        if: matrix.os == 'macos'
        env:
          TEBAKO_RUNTIME_ROOT: runtime-packages
        run: |
          set -euo pipefail
          TEBAKO_TFS=$(echo .build/downloads/tfs/*/tfs-*)
          export TEBAKO_TFS
          tools/boot_smoke

      - name: Boot smoke (windows)
        if: matrix.os == 'windows' && steps.build-windows.outputs.skipped != 'true'
        shell: msys2 {0}
        env:
          TEBAKO_RUNTIME_ROOT: runtime-packages
        run: |
          set -euo pipefail
          TEBAKO_TFS=$(echo .build/downloads/tfs/*/tfs-*)
          export TEBAKO_TFS
          tools/boot_smoke

      # The leg's workspace, kept for a day as build diagnostics: one
      # artifact per (platform, arch, python) leg. The publish stage
      # below reads runtime-packages/ in place — since the de-rendezvous
      # (spec 13 §2a) nothing downloads this artifact anymore. Uploads
      # even when the build or boot smoke failed (always()) — a red leg's
      # packages are exactly the ones worth diagnosing.
      - name: Upload the runtime packages
        if: ${{ always() && (matrix.os != 'windows' || steps.build-windows.outputs.skipped != 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-packages-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.python }}
          path: runtime-packages
          retention-days: 1

      # Spec 13 §2a (the de-rendezvous, tebako-runtime-ruby#161's
      # pattern): the leg that built a package publishes it — payload
      # assets + .sha256 sidecars + the .manifest.json shard, write-once
      # names this leg owns alone — and then signs every served name in
      # the same invocation (spec 09 §5's no-fold rule). No shared file
      # exists, so N legs publish concurrently with zero rendezvous.
      # The tooling interpreter must exist on EVERY runner a publish leg
      # can land on: ruby/setup-ruby's windows-11 (arm64) catalog starts
      # at 3.4.1, so 3.3 fails there with "Unknown version 3.3" (the
      # tebako-runtime-ruby publish run 35669322382 lost all 8 arm64 legs
      # to it). 3.4 is served on every image in the matrix, and the
      # Gemfile already carries the base64 shim for 3.4+ hosts.
      - name: Setup Ruby for the publish tooling
        if: ${{ inputs.publish && !inputs.audit }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Publish the leg's runtime package (spec 13 §2a)
        if: ${{ inputs.publish && !inputs.audit }}
        shell: bash
        env:
          # The job-level runner GITHUB_TOKEN authenticates the release
          # API calls (the audit mutates only this repo's own release —
          # see publish.yml's header).
          TEBAKO_VERSION: ${{ needs.compute.outputs.tebako_version }}
          EXPECTED_ENV_MATRIX: '[{"os":"${{ matrix.os }}","arch":"${{ matrix.arch }}"}]'
          EXPECTED_PYTHON_MATRIX: '["${{ matrix.python }}"]'
          FORCE_REBUILD: ${{ inputs.force_rebuild && 'true' || 'false' }}
          TEBAKO_RELEASE_SIGNING_ENABLED: ${{ vars.TEBAKO_RELEASE_SIGNING_ENABLED }}
          TEBAKO_RELEASE_SIGNING_KEYID: ${{ vars.TEBAKO_RELEASE_SIGNING_KEYID }}
        run: |
          set -euo pipefail
          # The boot smoke materializes the PE-named libpython DLL copy
          # (libpython<X.Y>.dll, tools/boot_smoke's materialize_python_dll)
          # next to the exe — never a release asset (the release ships
          # the DLL as <runtime>.dll; without this rm the glob below
          # would read the copy as a package of its own).
          rm -f runtime-packages/libpython*.dll
          ./scripts/upload_release.rb

      - name: Sign the leg's release assets (spec 09 §5)
        if: ${{ inputs.publish && !inputs.audit }}
        shell: bash
        env:
          TEBAKO_VERSION: ${{ needs.compute.outputs.tebako_version }}
          TEBAKO_PKG_HOST_ID: ${{ matrix.sign_tool_host_id }}
          TEBAKO_RELEASE_SIGNING_ENABLED: ${{ vars.TEBAKO_RELEASE_SIGNING_ENABLED }}
          TEBAKO_RELEASE_SIGNING_KEY: ${{ secrets.TEBAKO_RELEASE_SIGNING_KEY }}
          SIGN_ONLY_STEMS: tebako-runtime-${{ needs.compute.outputs.tebako_version }}-${{ matrix.python }}-${{ matrix.host_id }}
        run: ./scripts/sign_release.rb

  # The terminal aggregate — and the branch-protection gate. The build
  # legs are a dynamic matrix whose check names shift with the catalog
  # (a version bump renames every leg), so protection pins this job's
  # stable per-platform check name ("<platform> / all legs green")
  # instead of any leg's. Green means: the contract/matrix computed and
  # every emitted leg succeeded; a platform whose filter emits no legs
  # gates on compute alone. Audit runs (publish.yml's audit mode) build
  # nothing and skip this job.
  verify:
    name: all legs green
    needs: [compute, build]
    if: ${{ always() && !cancelled() && !inputs.audit }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the legs
        run: |
          set -euo pipefail
          echo "compute: ${{ needs.compute.result }} (run=${{ needs.compute.outputs.run }}, legs=${{ needs.compute.outputs.leg_count }})"
          echo "build:   ${{ needs.build.result }}"
          if [ "${{ needs.compute.result }}" != "success" ]; then
            echo "::error::the contract/matrix computation failed"
            exit 1
          fi
          if [ "${{ needs.compute.outputs.run }}" = "true" ] && [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::not every ${{ inputs.platform }} leg succeeded: ${{ needs.build.result }}"
            exit 1
          fi
